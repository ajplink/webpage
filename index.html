<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Associação Plink — em manutenção</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #faf9f7;
    color: #1c1b19;
    line-height: 1.6;
  }
  main { max-width: 32rem; text-align: center; }
  .spark { font-size: 3rem; line-height: 1; }
  h1 {
    margin: 1.5rem 0 0.75rem;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  p { color: #55524d; }
  p.en { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #dcd8d1; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #14130f; color: #ece9e2; }
    p { color: #a8a49b; }
    p.en { border-top-color: #35322c; }
  }
</style>
</head>
<body>
<main>
  <div class="spark" aria-hidden="true">⚡</div>
  <h1>Website em manutenção</h1>
  <p>Estamos a preparar algo novo. Voltamos em breve.</p>
  <p class="en" lang="en">Website under construction — we'll be back soon.</p>
</main>
</body>
</html>
